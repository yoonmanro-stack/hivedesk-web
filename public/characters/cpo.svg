<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="55%" r="60%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="1"/>
    </radialGradient>
  </defs>
  <circle cx="200" cy="200" r="200" fill="#0F0F0F"/>
  <circle cx="200" cy="200" r="200" fill="url(#bg)"/>

  <!-- Blazer body -->
  <path d="M55 400 Q75 295 150 275 Q172 268 200 266 Q228 268 250 275 Q325 295 345 400Z" fill="#1E1B4B"/>
  <!-- White shirt underneath -->
  <path d="M178 278 Q200 270 222 278 L218 310 Q200 305 182 310Z" fill="#E8E8F0"/>
  <!-- Blazer lapels -->
  <path d="M178 278 Q165 290 155 320 Q170 305 185 310 L185 278Z" fill="#2D2870"/>
  <path d="M222 278 Q235 290 245 320 Q230 305 215 310 L215 278Z" fill="#2D2870"/>
  <!-- Shirt collar -->
  <path d="M186 278 Q200 270 214 278 Q208 286 200 288 Q192 286 186 278Z" fill="#F0F0F8"/>

  <!-- Neck -->
  <path d="M183 258 Q200 252 217 258 L215 278 Q200 272 185 278Z" fill="#E0B88A"/>

  <!-- Head -->
  <ellipse cx="200" cy="192" rx="72" ry="76" fill="#E8C49A"/>

  <!-- Ears -->
  <ellipse cx="128" cy="199" rx="10" ry="14" fill="#DDB07A"/>
  <ellipse cx="272" cy="199" rx="10" ry="14" fill="#DDB07A"/>

  <!-- Hair - neat, brown, slightly styled -->
  <path d="M128 168 Q132 118 200 115 Q268 118 272 168 Q258 135 232 128 Q215 124 200 125 Q180 126 162 132 Q140 140 128 168Z" fill="#5C3A1E"/>
  <!-- Natural hair highlight -->
  <path d="M175 125 Q195 120 215 126" stroke="#7A4F2D" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Eyebrows - attentive, clean -->
  <path d="M162 181 Q173 176 186 179" stroke="#3A2010" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M214 179 Q227 176 238 181" stroke="#3A2010" stroke-width="3.5" stroke-linecap="round" fill="none"/>

  <!-- Eyes - attentive, engaged -->
  <ellipse cx="174" cy="193" rx="12" ry="10" fill="#fff"/>
  <ellipse cx="174" cy="193" rx="7" ry="7" fill="#2C1A0E"/>
  <circle cx="176" cy="190" r="2.5" fill="#fff"/>

  <ellipse cx="226" cy="193" rx="12" ry="10" fill="#fff"/>
  <ellipse cx="226" cy="193" rx="7" ry="7" fill="#2C1A0E"/>
  <circle cx="228" cy="190" r="2.5" fill="#fff"/>

  <!-- Nose -->
  <path d="M196 208 Q200 218 204 208" stroke="#C9906A" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Slight engaged smile -->
  <path d="M182 229 Q200 238 218 229" stroke="#A07050" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- TABLET PC - key prop, held in front/side -->
  <g transform="translate(255 230) rotate(10)">
    <!-- Tablet body -->
    <rect x="0" y="0" width="65" height="85" rx="7" fill="#1E1B4B" stroke="#8B5CF6" stroke-width="2"/>
    <!-- Screen -->
    <rect x="5" y="7" width="55" height="65" rx="3" fill="#0D0B1A"/>
    <!-- Screen glow - purple tint -->
    <rect x="5" y="7" width="55" height="65" rx="3" fill="#8B5CF6" fill-opacity="0.12"/>
    <!-- Screen content lines -->
    <line x1="10" y1="18" x2="55" y2="18" stroke="#8B5CF6" stroke-width="1.5" opacity="0.6"/>
    <line x1="10" y1="26" x2="50" y2="26" stroke="#8B5CF6" stroke-width="1" opacity="0.4"/>
    <line x1="10" y1="34" x2="52" y2="34" stroke="#8B5CF6" stroke-width="1" opacity="0.4"/>
    <rect x="10" y="42" width="20" height="14" rx="2" fill="#8B5CF6" fill-opacity="0.3"/>
    <rect x="35" y="42" width="20" height="14" rx="2" fill="#8B5CF6" fill-opacity="0.2"/>
    <!-- Home button -->
    <circle cx="32.5" cy="77" r="4" stroke="#8B5CF6" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Arm holding tablet -->
  <path d="M245 290 Q260 270 265 250" stroke="#E0B88A" stroke-width="14" stroke-linecap="round" fill="none"/>
</svg>
