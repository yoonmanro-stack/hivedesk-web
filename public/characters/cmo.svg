<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="55%" r="60%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="1"/>
    </radialGradient>
  </defs>
  <circle cx="200" cy="200" r="200" fill="#0F0F0F"/>
  <circle cx="200" cy="200" r="200" fill="url(#bg)"/>

  <!-- Shirt/jacket body -->
  <path d="M55 400 Q72 292 148 272 Q172 263 200 261 Q228 263 252 272 Q328 292 345 400Z" fill="#1C1C2E"/>

  <!-- COLORFUL SCARF - key identifier -->
  <!-- Scarf main drape left -->
  <path d="M148 274 Q135 295 120 330 Q118 350 125 360 Q140 340 145 315 Q150 295 160 282Z" fill="#F59E0B" opacity="0.9"/>
  <!-- Scarf main drape right (overlapping) -->
  <path d="M252 274 Q262 295 270 330 Q275 350 268 365 Q258 340 252 312 Q248 292 240 282Z" fill="#EC4899" opacity="0.9"/>
  <!-- Scarf around neck front -->
  <path d="M160 280 Q175 268 200 265 Q225 268 240 280 Q232 295 215 298 Q200 302 185 298 Q168 295 160 280Z" fill="#F97316"/>
  <!-- Scarf fold line detail -->
  <path d="M162 282 Q200 275 238 282" stroke="#FCD34D" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M165 290 Q200 284 235 290" stroke="#FCD34D" stroke-width="1.5" fill="none" opacity="0.4"/>

  <!-- Neck -->
  <path d="M184 255 Q200 249 216 255 L214 272 Q200 266 186 272Z" fill="#DCBA8A"/>

  <!-- Head -->
  <ellipse cx="200" cy="190" rx="71" ry="75" fill="#E8C49A"/>

  <!-- Ears -->
  <ellipse cx="129" cy="197" rx="10" ry="14" fill="#DDB07A"/>
  <ellipse cx="271" cy="197" rx="10" ry="14" fill="#DDB07A"/>

  <!-- Hair - well-groomed, confident, medium dark -->
  <path d="M129 168 Q133 120 200 117 Q267 120 271 168 Q255 138 228 132 Q210 128 200 129 Q182 130 164 136 Q141 144 129 168Z" fill="#3D2810"/>
  <!-- Hair highlight -->
  <path d="M180 128 Q200 123 220 129" stroke="#5A3E20" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <!-- Side wave -->
  <path d="M129 168 Q136 152 148 148 Q140 162 135 175Z" fill="#3D2810"/>

  <!-- Eyebrows - expressive, slightly raised -->
  <path d="M161 182 Q173 175 187 179" stroke="#2A1808" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M213 179 Q227 175 239 182" stroke="#2A1808" stroke-width="3.5" stroke-linecap="round" fill="none"/>

  <!-- Eyes - expressive, slightly wide open -->
  <ellipse cx="174" cy="194" rx="13" ry="11" fill="#fff"/>
  <ellipse cx="174" cy="194" rx="8" ry="7.5" fill="#2C1A0E"/>
  <circle cx="177" cy="191" r="3" fill="#fff"/>

  <ellipse cx="226" cy="194" rx="13" ry="11" fill="#fff"/>
  <ellipse cx="226" cy="194" rx="8" ry="7.5" fill="#2C1A0E"/>
  <circle cx="229" cy="191" r="3" fill="#fff"/>

  <!-- Nose -->
  <path d="M196 210 Q200 221 204 210" stroke="#C9906A" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- BIG DYNAMIC SMILE - key expression for CMO -->
  <path d="M178 231 Q200 248 222 231" stroke="#A07050" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Teeth hint -->
  <path d="M180 232 Q200 244 220 232 Q220 238 200 240 Q180 238 180 232Z" fill="#F8F8F8" opacity="0.8"/>
  <!-- Laugh lines -->
  <path d="M168 230 Q162 222 163 212" stroke="#C9906A" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.5"/>
  <path d="M232 230 Q238 222 237 212" stroke="#C9906A" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.5"/>
</svg>
