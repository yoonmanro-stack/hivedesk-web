<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="bc">
      <ellipse cx="50" cy="68" rx="22" ry="26"/>
    </clipPath>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Glow bg -->
  <circle cx="50" cy="55" r="44" fill="url(#glow)"/>
  <!-- Wings -->
  <ellipse cx="26" cy="53" rx="17" ry="9" fill="rgba(255,255,255,0.7)" transform="rotate(-22,26,53)"/>
  <ellipse cx="74" cy="53" rx="17" ry="9" fill="rgba(255,255,255,0.7)" transform="rotate(22,74,53)"/>
  <ellipse cx="26" cy="53" rx="17" ry="9" fill="none" stroke="rgba(0,0,0,0.08)" stroke-width="0.5" transform="rotate(-22,26,53)"/>
  <ellipse cx="74" cy="53" rx="17" ry="9" fill="none" stroke="rgba(0,0,0,0.08)" stroke-width="0.5" transform="rotate(22,74,53)"/>
  <!-- Body -->
  <ellipse cx="50" cy="68" rx="22" ry="26" fill="#F5A623"/>
  <ellipse cx="50" cy="68" rx="22" ry="26" fill="none" stroke="#1A1208" stroke-width="1.2"/>
  <!-- Stripes -->
  <rect x="28" y="62" width="44" height="7" fill="#1A1208" clip-path="url(#bc)"/>
  <rect x="28" y="74" width="44" height="7" fill="#1A1208" clip-path="url(#bc)"/>
  <!-- Stinger -->
  <ellipse cx="50" cy="93" rx="4" ry="2.5" fill="#1A1208"/>
  <!-- Head -->
  <circle cx="50" cy="42" r="18" fill="#F5A623"/>
  <circle cx="50" cy="42" r="18" fill="none" stroke="#1A1208" stroke-width="1.2"/>
  <!-- Antennae -->
  <line x1="44" y1="26" x2="39" y2="16" stroke="#1A1208" stroke-width="2" stroke-linecap="round"/>
  <circle cx="38" cy="14" r="3.2" fill="#F5A623" stroke="#1A1208" stroke-width="1.5"/>
  <line x1="56" y1="26" x2="61" y2="16" stroke="#1A1208" stroke-width="2" stroke-linecap="round"/>
  <circle cx="62" cy="14" r="3.2" fill="#F5A623" stroke="#1A1208" stroke-width="1.5"/>
  <!-- Eyes -->
  <ellipse cx="43" cy="41" rx="4" ry="4.5" fill="#1A1208"/>
  <ellipse cx="57" cy="41" rx="4" ry="4.5" fill="#1A1208"/>
  <circle cx="44.5" cy="39.2" r="1.6" fill="white"/>
  <circle cx="58.5" cy="39.2" r="1.6" fill="white"/>
  <!-- Smile -->
  <path d="M44 49 Q50 56 56 49" stroke="#1A1208" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Cheeks -->
  <circle cx="37" cy="47" r="4" fill="#FF8C69" opacity="0.4"/>
  <circle cx="63" cy="47" r="4" fill="#FF8C69" opacity="0.4"/>
  
  <!-- Money bag -->
  <g transform="translate(73,79)">
    <ellipse cx="0" cy="3" rx="10" ry="10" fill="#10B981" stroke="#1A1208" stroke-width="1.2"/>
    <path d="M-4,-7 C-4,-12 4,-12 4,-7 C6,-7 6,-5 4,-5 L-4,-5 C-6,-5 -6,-7 -4,-7 Z" fill="#10B981" stroke="#1A1208" stroke-width="1.2"/>
    <line x1="0" y1="-2" x2="0" y2="8" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <line x1="-3" y1="1" x2="3" y2="1" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <line x1="-3" y1="5" x2="3" y2="5" stroke="white" stroke-width="2" stroke-linecap="round"/>
