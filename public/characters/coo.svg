<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="55%" r="60%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="1"/>
    </radialGradient>
  </defs>
  <circle cx="200" cy="200" r="200" fill="#0F0F0F"/>
  <circle cx="200" cy="200" r="200" fill="url(#bg)"/>

  <!-- Button-up shirt body -->
  <path d="M58 400 Q75 292 150 272 Q172 263 200 261 Q228 263 250 272 Q325 292 342 400Z" fill="#1A2035"/>
  <!-- Shirt front placket -->
  <rect x="193" y="272" width="14" height="90" fill="#1E2845"/>
  <!-- Shirt buttons -->
  <circle cx="200" cy="288" r="3" fill="#374151"/>
  <circle cx="200" cy="306" r="3" fill="#374151"/>
  <circle cx="200" cy="324" r="3" fill="#374151"/>
  <!-- Collar -->
  <path d="M165 272 Q185 262 200 260 Q215 262 235 272 Q225 288 215 292 Q200 296 185 292 Q175 288 165 272Z" fill="#F8F8FF"/>
  <path d="M165 272 L185 280 Q193 284 200 286 Q207 284 215 280 L235 272" fill="none" stroke="#E8E8F0" stroke-width="1.5"/>

  <!-- Neck -->
  <path d="M184 254 Q200 248 216 254 L214 272 Q200 266 186 272Z" fill="#F0C8A8"/>

  <!-- Head -->
  <ellipse cx="200" cy="190" rx="70" ry="74" fill="#F0C8A8"/>

