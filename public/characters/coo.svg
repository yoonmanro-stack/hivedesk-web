    <rect x="0" y="0" width="38" height="48" rx="3" fill="#2D3B55" stroke="#F97316" stroke-width="1.5"/>
    <!-- Spiral binding -->
    <circle cx="4" cy="8" r="3" fill="none" stroke="#F97316" stroke-width="1.5"/>
    <circle cx="4" cy="18" r="3" fill="none" stroke="#F97316" stroke-width="1.5"/>
    <circle cx="4" cy="28" r="3" fill="none" stroke="#F97316" stroke-width="1.5"/>
    <circle cx="4" cy="38" r="3" fill="none" stroke="#F97316" stroke-width="1.5"/>
    <!-- Page lines -->
    <line x1="10" y1="12" x2="32" y2="12" stroke="#F97316" stroke-width="1" opacity="0.5"/>
    <line x1="10" y1="20" x2="32" y2="20" stroke="#F97316" stroke-width="1" opacity="0.5"/>
    <line x1="10" y1="28" x2="32" y2="28" stroke="#F97316" stroke-width="1" opacity="0.5"/>
    <line x1="10" y1="36" x2="28" y2="36" stroke="#F97316" stroke-width="1" opacity="0.5"/>
  </g>
</svg>
