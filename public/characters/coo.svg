  <ellipse cx="130" cy="197" rx="10" ry="13" fill="#DEB898"/>
  <ellipse cx="270" cy="197" rx="10" ry="13" fill="#DEB898"/>

  <!-- Hair - pulled back, neat bun/ponytail at back -->
  <path d="M130 168 Q134 125 200 122 Q266 125 270 168 Q255 140 228 135 Q212 131 200 132 Q183 133 165 138 Q143 146 130 168Z" fill="#2D1810"/>
  <!-- Hair pulled back sides smooth -->
  <path d="M130 168 Q135 145 148 140 Q138 158 133 174Z" fill="#2D1810"/>
  <path d="M270 168 Q265 145 252 140 Q262 158 267 174Z" fill="#2D1810"/>
  <!-- Subtle highlights -->
  <path d="M175 132 Q200 127 222 134" stroke="#4A2820" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Eyebrows - organized, neat -->
  <path d="M162 181 Q174 176 186 179" stroke="#2A1808" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M214 179 Q226 176 238 181" stroke="#2A1808" stroke-width="3.5" stroke-linecap="round" fill="none"/>

  <!-- Eyes - focused, organized -->
  <ellipse cx="174" cy="193" rx="12" ry="10" fill="#fff"/>
  <ellipse cx="174" cy="193" rx="7" ry="6.5" fill="#2C1A0E"/>
  <circle cx="176.5" cy="190.5" r="2.3" fill="#fff"/>

  <ellipse cx="226" cy="193" rx="12" ry="10" fill="#fff"/>
  <ellipse cx="226" cy="193" rx="7" ry="6.5" fill="#2C1A0E"/>
  <circle cx="228.5" cy="190.5" r="2.3" fill="#fff"/>

  <!-- Nose -->
  <path d="M196 209 Q200 219 204 209" stroke="#D4956A" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Confident focused expression -->
  <path d="M183 230 Q200 238 217 230" stroke="#A07050" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- LANYARD/BADGE - key identifier -->
  <!-- Lanyard string left side -->
  <path d="M178 282 Q162 310 158 340" stroke="#F97316" stroke-width="3.5" fill="none"/>
  <!-- Lanyard string right side -->
  <path d="M178 282 Q188 312 186 340" stroke="#F97316" stroke-width="3.5" fill="none"/>
  <!-- ID Badge -->
  <rect x="152" y="340" width="40" height="30" rx="4" fill="#1E2845" stroke="#F97316" stroke-width="2"/>
  <!-- Badge photo placeholder -->
  <rect x="156" y="344" width="12" height="14" rx="2" fill="#F97316" fill-opacity="0.4"/>
  <!-- Badge lines -->
  <line x1="172" y1="347" x2="188" y2="347" stroke="#F97316" stroke-width="1.5" opacity="0.6"/>
  <line x1="172" y1="353" x2="186" y2="353" stroke="#F97316" stroke-width="1" opacity="0.4"/>
  <line x1="172" y1="358" x2="184" y2="358" stroke="#F97316" stroke-width="1" opacity="0.3"/>

  <!-- SMALL DIARY/NOTEBOOK - additional prop hint -->
