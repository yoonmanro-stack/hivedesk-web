  <ellipse cx="174" cy="192" rx="7.5" ry="7" fill="#3D1A0A"/>
  <circle cx="177" cy="189" r="2.8" fill="#fff"/>

  <ellipse cx="226" cy="192" rx="12.5" ry="10.5" fill="#fff"/>
  <ellipse cx="226" cy="192" rx="7.5" ry="7" fill="#3D1A0A"/>
  <circle cx="229" cy="189" r="2.8" fill="#fff"/>

