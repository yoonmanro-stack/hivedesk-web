    <path d="M22.5 -10 Q25.5 -22 22.5 -34" stroke="#06B6D4" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.5"/>
    <path d="M33 -8 Q30 -18 33 -28" stroke="#06B6D4" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.4"/>
